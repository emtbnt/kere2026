name: Monitor Kereby listings

on:
  schedule:
    # Starts a new job every hour. Each job then loops internally every 30
    # seconds for 58 minutes, giving continuous near-real-time coverage.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Allow up to 60 minutes per run (GitHub's max is 6 hours, but 60 is plenty)
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run monitor loop (30-second interval for 58 minutes)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_INTERVAL_SECONDS: "30"
          LOOP_DURATION_MINUTES: "58"
        run: python monitor.py

      - name: Commit updated snapshot
        if: always()  # save snapshot even if a check errored mid-loop
        run: |
          git config user.name "kereby-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_hash.txt last_snapshot.txt
          git diff --quiet --cached || git commit -m "Update snapshot [skip ci]"
          git push
